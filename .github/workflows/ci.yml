name: CI - Build and Push Docker Image

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dedication-devops:latest .

      - name: Tag Docker Image
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/dedication-devops:latest \
          ${{ secrets.DOCKERHUB_USERNAME }}/dedication-devops:$SHORT_SHA

      - name: Push Latest Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/dedication-devops:latest

      - name: Push SHA Tag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/dedication-devops:$SHORT_SHA