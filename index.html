<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Home / Dashboard</title>
    <link rel="stylesheet" href="style.css?v=1.0">
    <style>
        /* Basic fallback styles in case external CSS fails */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        nav { margin-bottom: 20px; display: flex; gap: 15px; }
        nav a { text-decoration: none; color: #3498db; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .dashboard-stats { display: flex; gap: 20px; margin-top: 20px; }
        .stat-card { flex: 1; background: #e8f4f8; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #d1e8f0; }
        .stat-card h3 { margin: 0; color: #3498db; font-size: 2em; }
        .stat-card p { margin: 5px 0 0; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to TaskFlow</h1>
            <p>Your lightweight task-management solution.</p>
            <nav>
                <a href="index.html">Home</a>
                <a href="task-list.html">Tasks</a>
                <a href="add-task.html">Add Task</a>
                <a href="about.html">Help/About</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Dashboard Overview</h2>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <h3>12</h3>
                        <p>Total Tasks</p>
                    </div>
                    <div class="stat-card" style="background: #fdf6e3; border-color: #fde8b3;">
                        <h3 style="color: #f39c12;">5</h3>
                        <p>Pending</p>
                    </div>
                    <div class="stat-card" style="background: #e9f7ef; border-color: #c3e6cb;">
                        <h3 style="color: #27ae60;">7</h3>
                        <p>Completed</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
