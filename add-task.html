<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task – TaskFlow</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
    <div class="container">
        <header>
            <h1>Add New Task</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="add-task.html">Add Task</a>
                <a href="task-list.html">Task List</a>
                <a href="task-detail.html">Task Detail</a>
                <a href="about.html">About</a>
            </nav>
        </header>

    <main>
        <p class="subtitle">Fill in the details below to create a new task.</p>

        <div class="form-card">
            <div class="form-group">
                <label for="task-title">Task Title <span class="required">*</span></label>
                <input type="text" id="task-title" name="task-title" placeholder="Enter task title" required>
            </div>

            <div class="form-group">
                <label for="task-description">Description</label>
                <textarea id="task-description" name="task-description" rows="4" placeholder="Enter task description"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="due-date">Due Date <span class="required">*</span></label>
                    <input type="date" id="due-date" name="due-date" required>
                </div>

                <div class="form-group">
                    <label for="priority">Priority <span class="required">*</span></label>
                    <select id="priority" name="priority" required>
                        <option value="" disabled selected>Select priority</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-primary" onclick="submitTask()">Add Task</button>
                <button type="button" class="btn-secondary" onclick="resetForm()">Clear</button>
            </div>

            <div id="success-msg" class="success-msg" style="display:none;">
                ✅ Task added successfully! <a href="task-list.html">View Task List</a>
            </div>
        </div>
    </main>

    <script>
        function submitTask() {
            const title = document.getElementById('task-title').value.trim();
            const dueDate = document.getElementById('due-date').value;
            const priority = document.getElementById('priority').value;

            if (!title || !dueDate || !priority) {
                alert('Please fill in all required fields.');
                return;
            }

            document.getElementById('success-msg').style.display = 'block';
            resetForm();
        }

        function resetForm() {
            document.getElementById('task-title').value = '';
            document.getElementById('task-description').value = '';
            document.getElementById('due-date').value = '';
            document.getElementById('priority').value = '';
        }
    </script>
    
        <footer>
            <p>&copy; 2026 TaskFlow. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
